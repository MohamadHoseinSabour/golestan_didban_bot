[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "divar-bot"
version = "0.1.0"
description = "Telegram bot monitoring personal real-estate listings on Divar.ir (Golestan, Ahvaz)"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    # Telegram
    "python-telegram-bot[socks]>=21.0",
    # HTTP client
    "httpx[http2,socks]>=0.27",
    "tenacity>=8.3",
    # HTML parsing
    "selectolax>=0.3",
    # Browser automation (fallback)
    "playwright>=1.44",
    # Config & validation
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    # Database
    "aiosqlite>=0.20",
    # Time
    "pytz>=2024.1",
    # Utilities
    "structlog>=24.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-pyyaml",
    "types-pytz",
]

[project.scripts]
divar-bot = "divar_bot.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/divar_bot"]

[tool.ruff]
src = ["src"]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "C4", "RUF"]
ignore = [
    "RUF001",  # Ambiguous Persian characters (digits, comma)
    "RUF002",  # Docstring ambiguous characters
    "RUF003",  # Comment ambiguous characters
    "E501",    # Line too long
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "RUF059", "ANN"]
"scripts/*" = ["T201", "ANN", "B007", "F841", "N806", "RUF013"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = false
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src/divar_bot --cov-report=term-missing"

[tool.coverage.run]
source = ["src/divar_bot"]
omit = ["tests/*", "scripts/*"]
