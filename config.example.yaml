# Divar Alert Bot — Configuration
# Copy this to config.yaml and adjust values.
# All settings can be overridden via environment variables.

divar:
  # One or more Divar search URLs (personal listings, Golestan Ahvaz)
  urls:
    - "https://divar.ir/s/ahvaz/rent-residential/golestan?bbox=48.6212883%2C31.2400131%2C48.6597023%2C31.2872963&business-type=personal%2C&districts=4574%2C&map_bbox=48.625774%2C31.261142%2C48.664184%2C31.308414&map_place_hash=7%7C323%2C4574%7Cresidential-rent%7C%7C"
    - "https://divar.ir/s/ahvaz/buy-apartment/golestan?bbox=48.6257744%2C31.2611427%2C48.6641846%2C31.3084145&business-type=personal%2C&districts=4574%2C&map_bbox=48.625774%2C31.261142%2C48.664184%2C31.308414&map_place_hash=7%7C323%2C4574%7Cresidential-rent%7C%7C"

  # Whether to include bbox parameter in API calls (verified in recon phase)
  use_bbox: true

  # Polling interval in seconds (±jitter_seconds)
  poll_interval_seconds: 60
  jitter_seconds: 5

  # Ignore listings older than this (minutes) — prevents spam after bot restarts
  max_ad_age_minutes: 180

  # Max listings to send per poll cycle
  max_send_per_cycle: 20

  # Number of latest listings to send on first run (0 = none, just mark seen)
  notify_on_first_run: 0

  # Words in title/description that indicate an agency listing (secondary filter)
  agency_keywords:
    - "املاک"
    - "مشاور املاک"
    - "مشاورین املاک"
    - "بنگاه"
    - "آژانس املاک"
    - "گروه املاک"
    - "دپارتمان املاک"
    - "مسکن مهر"
    - "کارگزاری املاک"
    - "دفتر املاک"

  # Optional price/area filters (null = no filter)
  min_price: null
  max_price: null
  min_area_m2: null
  max_area_m2: null

  # Send thumbnail image with notification
  send_thumbnail: true

telegram:
  # Notification timezone
  timezone: "Asia/Tehran"

  # Max message length (Telegram limit: 4096)
  max_message_length: 4096

database:
  path: "data/divar_bot.db"

logging:
  level: "INFO"
  # Log file rotation: max size in MB, backup count
  max_file_mb: 10
  backup_count: 5
  log_dir: "logs"
